name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova and Build APK
        run: |
          npm install -g cordova
          cordova create app_build com.colplan.app Colplan
          cd app_build
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          
          # Trova automaticamente il tuo file colplan-xxx.html e lo imposta come index.html per Cordova
          HTML_FILE=$(ls www/colplan*.html 2>/dev/null | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" www/index.html
          fi

          cordova platform add android
          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
