name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install ImageMagick & Cordova
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          npm install -g cordova

      - name: Install Cordova and Build APK
        run: |
          cordova create app_build com.colplan.app Colplan
          cd app_build
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true

          # Trova qualsiasi file .html (tranne index) e lo imposta come index.html
          HTMLFILE=$(find www -maxdepth 1 -iname "*.html" ! -iname "index.html" | head -n 1)
          if [ -n "$HTMLFILE" ]; then
            cp "$HTMLFILE" www/index.html
          fi

          # Plugin orientamento e riconoscimento vocale
          cordova plugin add cordova-plugin-screen-orientation
          cordova plugin add cordova-plugin-speechrecognition

          # Gestione icona (accetta icon.jpg, icon.jpeg o icon.png e la converte)
          ICONFILE=$(find www -maxdepth 1 -iname "icon.*" | head -n 1)
          if [ -n "$ICONFILE" ]; then
            convert "$ICONFILE" www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" \/>' config.xml
          fi

          # Rimuove il controllo restrittivo dello splash screen
          sed -i '/splash/d' config.xml 2>/dev/null || true

          cordova platform add android
          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
