name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install ImageMagick & Cordova
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          npm install -g cordova

      - name: Build APK
        run: |
          cordova create app_build com.colplan.app Colplan
          cd app_build
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          
          # 1. Trova il file html principale
          HTML_FILE=$(ls www/colplan*.html 2>/dev/null | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" www/index.html
          fi

          # 2. Converte l'icona caricata e la applica all'app
          ICON_FILE=$(ls www/icon.* 2>/dev/null | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            convert "$ICON_FILE" www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" \/>' config.xml
          fi

          # 3. Rimuove il blocco dello splash screen
          sed -i '/splash/d' config.xml 2>/dev/null || true

          cordova platform add android
          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
