name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install ImageMagick & Cordova
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          npm install -g cordova

      - name: Install Cordova and Build APK
        run: |
          # 1. Imposta nome Colplan e package ID
          cordova create app_build com.colplan.app Colplan
          cd app_build
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true

          # 2. Configura la pagina index.html
          HTMLFILE=$(find www -maxdepth 1 -iname "*.html" ! -iname "index.html" | head -n 1)
          if [ -n "$HTMLFILE" ]; then
            cp "$HTMLFILE" www/index.html
          fi

          # 3. Tutti i tuoi plugin nativi
          cordova plugin add cordova-plugin-screen-orientation
          cordova plugin add cordova-plugin-speechrecognition
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-x-socialsharing

          # 4. Aggiunge la piattaforma Android
          cordova platform add android

          # 5. Converte l'icona (jpg/jpeg/png) e la applica ovunque su Android
          ICONFILE=$(find www -maxdepth 1 -iname "icon.*" | head -n 1)
          if [ -n "$ICONFILE" ]; then
            convert "$ICONFILE" www/icon.png
            find platforms/android/app/src/main/res/ -name "ic_launcher*.png" -exec cp www/icon.png {} \;
            find platforms/android/app/src/main/res/ -name "screen.png" -exec cp www/icon.png {} \;
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" \/>' config.xml
          fi

          # 6. Rimuove l'obbligo dello splash screen per evitare blocchi
          sed -i '/splash/d' config.xml 2>/dev/null || true

          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
