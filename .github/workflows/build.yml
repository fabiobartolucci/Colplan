name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova and Build APK
        run: |
          npm install -g cordova
          cordova create app_build com.miaapp.app MiaApp
          cd app_build
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true

          HTMLFILE=$(find www -maxdepth 1 -name "*.html" ! -name "index.html" | head -n 1)
          if [ -n "$HTMLFILE" ]; then
            mv "$HTMLFILE" www/index.html
          fi

          cordova platform add android

          ICONFILE=$(find www -maxdepth 1 -iname "icon.png" | head -n 1)
          if [ -n "$ICONFILE" ]; then
            mkdir -p resources
            cp "$ICONFILE" resources/icon.png
            npm install -g cordova-res
            cordova-res android --skip-config --copy
          fi

          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
